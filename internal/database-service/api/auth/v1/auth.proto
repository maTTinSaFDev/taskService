syntax = "proto3";

package auth.v1;

option go_package = "database-service/api/auth/v1;authv1";

import "internal/database-service/api/user/v1/user.proto";

// AuthPersistenceService is an internal API used only by auth-service. It
// deliberately keeps password verification out of the database-service.
service AuthPersistenceService {
  rpc CreateUser(CreateUserRequest) returns (user.v1.User);
  rpc GetCredentialByEmail(GetCredentialByEmailRequest) returns (Credential);
  rpc GetUserById(GetUserByIdRequest) returns (user.v1.User);
}

// Credential is internal-only. It must never be forwarded by an HTTP API.
message Credential {
  user.v1.User user = 1;
  string password_hash = 2;
}

message CreateUserRequest {
  string name = 1;
  string email = 2;
  string password_hash = 3;
}

message GetCredentialByEmailRequest {
  string email = 1;
}

message GetUserByIdRequest {
  int64 user_id = 1;
}
