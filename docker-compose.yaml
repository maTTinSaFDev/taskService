services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    command:
      - /bin/sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi" ]
      interval: 5s
      timeout: 3s
      retries: 10
  database-service:
    build:
      context: .
      dockerfile: internal/database-service/Dockerfile
    environment:
      ADDRESS: ":${DATABASE_SERVICE_PORT}"
      DATABASE_URL: "${DATABASE_URL}"
      DATABASE_SERVICE_PORT: "${DATABASE_SERVICE_PORT}"
    ports:
      - "${DATABASE_SERVICE_PORT}:${DATABASE_SERVICE_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/$$DATABASE_SERVICE_PORT'" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  task-service:
    build:
      context: .
      dockerfile: internal/task-service/Dockerfile
    environment:
      DATABASE_SERVICE_ADDRESS: "database-service:${DATABASE_SERVICE_PORT}"
      JWT_PUBLIC_KEY_FILE: "/run/secrets/auth-public.pem"
      JWT_ISSUER: "${JWT_ISSUER:-taskflow-auth}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-taskflow-api}"
    volumes:
      - ./secrets/auth-public.pem:/run/secrets/auth-public.pem:ro
    ports:
      - "${TASK_SERVICE_PORT:-8080}:8080"
    depends_on:
      database-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8080'" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  auth-service:
    build:
      context: .
      dockerfile: internal/auth-service/Dockerfile
    environment:
      DATABASE_SERVICE_ADDRESS: "database-service:${DATABASE_SERVICE_PORT}"
      AUTH_SERVICE_ADDRESS: ":8090"
      JWT_PRIVATE_KEY_FILE: "/run/secrets/auth-private.pem"
      JWT_ISSUER: "${JWT_ISSUER:-taskflow-auth}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-taskflow-api}"
      ACCESS_TOKEN_TTL: "${ACCESS_TOKEN_TTL:-15m}"
      REFRESH_TOKEN_TTL: "${REFRESH_TOKEN_TTL:-720h}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
      REDIS_ADDRESS: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_DB: "${REDIS_DB:-0}"
    volumes:
      - ./secrets/auth-private.pem:/run/secrets/auth-private.pem:ro
    ports:
      - "${AUTH_SERVICE_PORT:-8090}:8090"
    depends_on:
      database-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8090'" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      task-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --spider http://127.0.0.1/" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
